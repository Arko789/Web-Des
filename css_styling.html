<!DOCTYPE html>
<html>
<head>
<title>CSS Text</title>
<style>
h1{color: rgb(209,11,11)}
h2{director: initial;}
h3{letter-spacing:3cap;}
h4{word-spacing:0cap;}
h5{Text-indent: 40px;}
h6{text-decoration:line-through;}
h5{white-space:inherit;}
h4{text-shadow: 2px 2px 4px rgb(121,4,230)}
h3{padding: 4px}
</style></head>
<body>
	<h1>Important CSS properties</h1>
	<h2>for direction</h2>
	<h3>for letter spacing</h3>
	<h4>word-spacing</h4>
	<h5>Text-indent</h5>
	<h6>text-decoration</h6>
	<h5>white-space</h5>
	<h4>text-shadow</h4>
	<h3>padding</h3>
</body>
</html>
